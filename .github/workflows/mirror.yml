name: Mirror WAHA Plus
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Pull, retag and push waha-plus
        run: |
          docker pull devlikeapro/waha-plus:latest
          docker tag devlikeapro/waha-plus:latest marcellomarinho/waha-plus:latest
          docker push marcellomarinho/waha-plus:latest
